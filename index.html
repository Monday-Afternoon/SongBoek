<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songboek</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;🎵&lt;/text&gt;&lt;/svg&gt;">
<script src="instellingen.js"></script>
<style>
:root{--bg:#f3f5f7;--fg:#1b2430;--muted:#6b7683;--chord:#0a5c8f;--card:#fff;--line:#d9dfe5;--goed:#1b7f3b}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--fg:#e6ebf0;--muted:#8d98a5;--chord:#6cc0f0;--card:#1b2129;--line:#2c353f;--goed:#6fdc97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
a{color:inherit}
h1{font-size:1.7rem;margin:.3em 0 .6em}
h1 a{text-decoration:none}
input[type=search]{width:100%;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.lijst{margin-top:12px;border-top:1px solid var(--line)}
.lijst a{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.lijst a:hover,.lijst a:focus-visible{background:var(--card)}
.lijst.compact a{padding:4px 4px}
.lijst .t{font-weight:600}.lijst .m{color:var(--muted);text-align:right}
.terug{display:inline-block;margin-bottom:8px;color:var(--chord)}
.info{color:var(--muted);margin:.2em 0}
.bedien{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.bedien button{font:inherit;min-width:42px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
.bedien button.aan{background:var(--chord);border-color:var(--chord);color:var(--bg);font-weight:700}
.bedien button:focus-visible{outline:2px solid var(--chord);outline-offset:2px}
.bedien .sp{width:10px}
.notenrij{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.noten{display:inline-block;padding:8px 14px;border:1px solid var(--chord);border-radius:6px;color:var(--chord);text-decoration:none;font-weight:600}
.noten:hover,.noten:focus-visible{background:var(--card)}
.ster{color:var(--chord);margin-right:.35em}
.vink{color:var(--goed);font-weight:700;margin-right:.35em}
.lijst a.goed .t{color:var(--goed)}
.kop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kop h1{margin:.3em 0}
.balk{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;background:var(--bg)}
.balk .los{color:var(--muted);font-size:.9rem}
.geluid{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.geluid audio{flex:1;min-width:200px}
audio[hidden]{display:none}
button.noten{font:inherit;background:transparent;cursor:pointer}
.scan,.pdfpagina{display:block;width:100%;height:auto;background:#fff;margin:0 0 8px}
.video{aspect-ratio:16/9;width:100%;max-width:560px;border:0;border-radius:6px;background:#000;margin:6px 0 4px}
.tekst{margin-top:14px}
.sec{font-weight:700;margin:1.4em 0 .35em;color:var(--muted)}
.regel{margin:0 0 .35em;line-height:1.35}
.seg{display:inline-flex;flex-direction:column;vertical-align:bottom}
.ch{color:var(--chord);font-weight:700;min-height:1.4em;padding-right:.5em}
.ly{white-space:pre;min-height:1.4em}
.akk{margin:0 0 .35em}.akk .ch{display:inline-block;padding-right:1em}
.leeg{height:.4em}
.fout{padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const SH = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
const FL = ['A','Bb','B','C','Db','D','Eb','E','F','Gb','G','Ab'];
const KNOPPEN = ['A','Bb','B','C','C#','D','Eb','E','F','F#','G','Ab'];
const FLAT_DUUR = new Set([8,1,6,11,4,9]);   // F Bb Eb Ab Db Gb
const FLAT_MOL  = new Set([5,10,3,8,1,6]);   // Dm Gm Cm Fm Bbm Ebm

// Kies de schrijfwijze die gitaristen verwachten: Bb/Eb/Ab, C#/F#, en alle kruisen in kruis-toonsoorten
const SHARP_DUUR = new Set([0,7,2]);   // A E B
const SHARP_MOL  = new Set([4,11,9]);  // C#m G#m F#m
function spelling(i, mineur) {
  if ((mineur ? FLAT_MOL : FLAT_DUUR).has(i)) return FL;
  if ((mineur ? SHARP_MOL : SHARP_DUUR).has(i)) return SH;
  return KNOPPEN;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idx = n => { const i = SH.indexOf(n); return i < 0 ? FL.indexOf(n) : i; };

function transponeer(akkoord, stappen, tabel) {
  const m = akkoord.match(/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/);
  if (!m) return akkoord;
  const noot = x => { const i = idx(x); return i < 0 ? x : tabel[(i + stappen + 120) % 12]; };
  return noot(m[1]) + m[2] + (m[3] ? '/' + noot(m[3]) : '');
}

function parseSong(tekst) {
  const meta = {};
  const bestanden = [];   // alle <meta>-velden waarvan de waarde een pdf/afbeelding is -> knop
  tekst = tekst.replace(/<meta>([\s\S]*?)<\/meta>/i, (_, m) => {
    m.split(';').forEach(d => {
      const i = d.indexOf(':'); if (i <= 0) return;
      const naam = d.slice(0,i).trim(), waarde = d.slice(i+1).trim();
      meta[naam.toLowerCase()] = waarde;
      const sp = splitsBestanden(waarde);
      if (sp.visueel || sp.geluiden.length) bestanden.push([naam, waarde]);
    });
    return '';
  });
  let key = '';
  tekst = tekst.replace(/<key>\{?([^<}]*)\}?<\/key>/i, (_, k) => { key = k.trim(); return ''; });
  let kop = '', capo = '';
  const regels = [];
  for (const raw of tekst.split(/\r?\n/)) {
    const r = raw.trim();
    if (!r) { if (regels.length && regels[regels.length-1].t !== 'leeg') regels.push({t:'leeg'}); continue; }
    if (/^capo\b/i.test(r)) { capo = r; continue; }
    if (!kop) { kop = r; continue; }
    let m;
    if ((m = r.match(/^<b>(.*)<\/b>$/i))) { regels.push({t:'sec', tekst:m[1].trim()}); continue; }
    if ((m = r.match(/^\{(.+)\}$/))) { regels.push({t:'akk', akkoorden:m[1].trim().split(/\s+/)}); continue; }
    const delen = raw.replace(/\s+$/,'').split(/\[([^\]]+)\]/);
    const segs = [];
    if (delen[0]) segs.push({ch:'', ly:delen[0]});
    for (let i = 1; i < delen.length; i += 2) segs.push({ch:delen[i], ly:delen[i+1] || ''});
    regels.push({t:'ly', segs});
  }
  return {meta, bestanden, key, kop, capo, regels};
}

// 'Capo: No capo', 'Capo: -' of 'Capo: geen' -> 0; 'Capo: 2' of 'Capo: 2e fret' -> 2
const ROMEINS = {I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
function capoUitTekst(s) {
  s = s || '';
  const m = s.match(/\d+/);
  if (m) return Math.min(parseInt(m[0], 10), 11);
  const r = s.match(/\b(XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)\b/);
  return r ? Math.min(ROMEINS[r[1]], 11) : 0;
}

// artiest uit de kopregel, na een streepje (-, – of —)
function artiestUitKop(k) {
  const m = k.match(/\s+-\s+|\s*[–—]\s*/);
  return m ? k.slice(m.index + m[0].length) : '';
}

function youtubeId(u) {
  if (!u) return '';
  const m = u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
  return m ? m[1] : u.trim();
}

const VISUEEL = /\.(pdf|jpe?g|png|gif|webp)$/i, GELUID = /\.(mp3|m4a|ogg|wav)$/i;
// Een <meta>-waarde mag een notenbeeld en/of meerdere geluidsfragmenten bevatten, gescheiden door |
// Voorbeeld: A.jpg|Piano=tenor1.mp3|Zang=tenor2.mp3  (de naam voor het = is het opschrift van de knop)
function splitsBestanden(w) {
  const delen = (w || '').split('|').map(x => x.trim()).filter(Boolean);
  const geluiden = [];
  let visueel = '';
  for (const d of delen) {
    const i = d.indexOf('=');
    const naam = i > 0 ? d.slice(0, i).trim() : '';
    const bestand = i > 0 ? d.slice(i + 1).trim() : d;
    if (GELUID.test(bestand)) geluiden.push({label: naam || bestand.replace(/\.[^.]+$/, ''), bestand});
    else if (!visueel && VISUEEL.test(bestand)) visueel = bestand;
  }
  return {visueel, geluiden};
}
let huidigGeluid = null;   // geluidsspeler die nu in beeld is; stopt als je de pagina verlaat
// Titel van de site: staat in instellingen.js, zodat een nieuwe index.html die niet overschrijft
const INST = Object.assign({titel: 'Songboek', tabbladTitel: 'Songboek'}, window.INSTELLINGEN || {});
const toestand = {};   // onthoudt key en capo per song tijdens het bezoek
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let terugNaar = '#';   // waar de terug-link van een song heen gaat (overzicht of repertoire)
const terugLink = () => `<a class="terug" href="${terugNaar}">‹ ${terugNaar === '#repertoire' ? 'Repertoire' : 'Alle songs'}</a>`;

// GitHub Pages let op hoofdletters: zoek de map 'songs' of 'Songs'
let mapBelofte;
function songsMap() {
  if (!mapBelofte) mapBelofte = (async () => {
    for (const m of ['songs', 'Songs']) {
      try { const r = await fetch(m + '/index.json'); if (r.ok) return m; } catch (e) {}
    }
    return 'songs';
  })();
  return mapBelofte;
}

// goed: ja  (ook 'true', '1' of 'x') in de <meta> = deze song gaat al goed
const isGoed = v => /^(ja|true|1|x)$/i.test(String(v == null ? '' : v).trim());

async function toonOverzicht(rep = false) {
  terugNaar = rep ? '#repertoire' : '#';
  document.title = rep ? 'Ons repertoire – ' + INST.tabbladTitel : INST.tabbladTitel;
  app.innerHTML = (rep
    ? '<a class="terug" href="#">‹ Alle songs</a><div class="kop"><h1>In ons repertoire</h1></div>'
    : '<div class="kop"><h1>' + esc(INST.titel) + '</h1><a class="noten" href="#repertoire">★ In ons repertoire</a></div>') + '<input type="search" id="zoek" placeholder="Zoek op titel of artiest" aria-label="Zoeken"><div class="lijst' + (rep ? ' compact' : '') + '" id="lijst"></div>';
  let songs;
  try {
    const r = await fetch((await songsMap()) + '/index.json', {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    songs = await r.json();
  } catch (e) {
    document.getElementById('lijst').outerHTML = '<div class="fout">De songlijst kon niet worden geladen. Draai <b>maak_index.py</b> en open de site via een webserver (niet direct als bestand).<br><small>Technische melding: ' + esc(String(e)) + '</small></div>';
    return;
  }
  if (rep) songs = songs.filter(s => s.repertoire);
  songs.sort((a,b) => a.titel.localeCompare(b.titel, 'nl'));
  const lijst = document.getElementById('lijst');
  const teken = () => {
    const q = document.getElementById('zoek').value.toLowerCase();
    lijst.innerHTML = songs.filter(s => (s.titel + ' ' + s.artiest).toLowerCase().includes(q)).map(s =>
      `<a class="${isGoed(s.goed) ? 'goed' : ''}" href="#/${encodeURIComponent(s.bestand)}"><span class="t">${s.repertoire && !rep ? '<span class="ster" role="img" aria-label="In ons repertoire">★</span>' : ''}${isGoed(s.goed) ? '<span class="vink" role="img" aria-label="Gaat al goed">✓</span>' : ''}${esc(s.titel)}</span><span class="m">${esc(s.artiest)}${s.key ? ' · ' + esc(s.key) : ''}</span></a>`).join('')
      || (rep && !songs.length
        ? '<p class="info">Nog geen songs in het repertoire. Zet <b>repertoire: ja</b> in de &lt;meta&gt; van een song en draai start_songboek.bat.</p>'
        : '<p class="info">Geen songs gevonden.</p>');
  };
  document.getElementById('zoek').addEventListener('input', teken);
  teken();
}

function laadScript(src) {
  return new Promise((ok, fout) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fout;
    document.head.appendChild(s);
  });
}

async function toonPdf(url, doel) {
  doel.innerHTML = '<p class="info">Notenbeeld laden…</p>';
  try {
    if (!window.pdfjsLib) await laadScript(PDFJS + 'pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument(url).promise;
    doel.innerHTML = '';
    const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
    for (let n = 1; n <= pdf.numPages; n++) {
      const pagina = await pdf.getPage(n);
      const schaal = (doel.clientWidth || 800) / pagina.getViewport({scale: 1}).width;
      const vp = pagina.getViewport({scale: schaal * dpr});
      const c = document.createElement('canvas');
      c.className = 'pdfpagina'; c.width = vp.width; c.height = vp.height;
      doel.appendChild(c);
      await pagina.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    }
  } catch (e) {
    doel.innerHTML = '<div class="fout">Het notenbeeld kon hier niet worden getoond. Gebruik <b>Los openen</b> rechtsboven.</div>';
  }
}

// Notenbeeld en/of geluid in de pagina zelf tonen, met een terug-knop naar de song
async function toonBestand(songBestand, waarde, label) {
  const map = await songsMap();
  const {visueel, geluiden} = splitsBestanden(waarde);
  const pad = f => map + '/' + encodeURIComponent(f);
  const naamKnop = g => geluiden.length > 1 ? esc(g.label) : 'Beluister';
  document.title = label + ' – ' + INST.tabbladTitel;
  app.innerHTML = `<div class="balk"><a class="noten" href="#/${encodeURIComponent(songBestand)}">‹ Terug naar de song</a><span class="info">${esc(label)}</span><a class="los" href="${pad(visueel || geluiden[0].bestand)}" target="_blank" rel="noopener">Los openen</a>` +
    (geluiden.length ? `<div class="geluid">${geluiden.map((g, i) => `<button class="noten" id="speel${i}" type="button">▶ ${naamKnop(g)}</button>`).join('')}<label class="info"><input type="checkbox" id="herhaal"> Herhaal</label><audio id="speler" controls preload="none" hidden></audio></div>` : '') +
    `</div><div id="inhoud"></div>`;
  if (geluiden.length) {
    const speler = document.getElementById('speler');
    const knoppen = geluiden.map((g, i) => document.getElementById('speel' + i));
    let actief = -1;
    huidigGeluid = speler;
    const zet = () => geluiden.forEach((g, i) => { knoppen[i].textContent = (actief === i && !speler.paused ? '⏸ ' : '▶ ') + naamKnop(g).replace(/&amp;/g, '&'); });
    knoppen.forEach((k, i) => k.addEventListener('click', () => {
      speler.hidden = false;
      if (actief !== i) { actief = i; speler.src = pad(geluiden[i].bestand); speler.play().catch(() => {}); }
      else if (speler.paused) speler.play().catch(() => {});
      else speler.pause();
      zet();
    }));
    ['play', 'pause', 'ended'].forEach(n => speler.addEventListener(n, zet));
    document.getElementById('herhaal').addEventListener('change', e => { speler.loop = e.target.checked; });
  }
  const inhoud = document.getElementById('inhoud');
  if (!visueel) inhoud.innerHTML = '<p class="info">Bij deze knop hoort alleen geluid.</p>';
  else if (/\.pdf$/i.test(visueel)) await toonPdf(pad(visueel), inhoud);
  else inhoud.innerHTML = `<img class="scan" src="${pad(visueel)}" alt="${esc(label)}">`;
}

async function toonSong(bestand) {
  app.innerHTML = '<p class="info">Laden…</p>';
  const map = await songsMap();
  let song;
  try {
    const r = await fetch(map + '/' + encodeURIComponent(bestand), {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    song = parseSong(await r.text());
  } catch (e) {
    app.innerHTML = terugLink() + '<div class="fout">Deze song kon niet worden geladen.</div>';
    return;
  }
  const titel = song.meta.titel || bestand.replace(/\.html$/i, '');
  document.title = titel + ' – ' + INST.tabbladTitel;
  const km = song.key.match(/^([A-G][#b]?)(m?)/);
  const origIdx = km ? idx(km[1]) : -1;
  const mineur = km ? km[2] === 'm' : false;
  const capoStart = capoUitTekst(song.capo);
  // afspraak in <meta> (bijv. afspraak: A2, C0): een knop die key en capo meteen op de afgesproken stand zet
  const afspraken = (song.meta.afspraak || '').split(',').map(x => x.trim()).filter(Boolean).map(x => {
    const m = (x[0].toUpperCase() + x.slice(1)).match(/^([A-G][#b]?)m?\s*(?:capo)?\s*(\d{1,2})?$/);
    return m && idx(m[1]) >= 0 ? {tekst: x, idx: idx(m[1]), capo: m[2] ? Number(m[2]) : 0} : null;
  }).filter(Boolean);
  // startKey in <meta> (bijv. startKey: Bb): de song opent meteen in die klinkende key
  const sk = (song.meta.startkey || '').match(/^([A-G][#b]?)/);
  let stap = (sk && origIdx >= 0 && idx(sk[1]) >= 0) ? (idx(sk[1]) - origIdx + 12) % 12 : 0;
  const startStap = stap;
  let capo = capoStart;
  const bewaard = toestand[bestand];
  if (bewaard) { stap = bewaard.stap; capo = bewaard.capo; }
  const vid = youtubeId(song.meta.youtubeurl);
  // knoppen: elk <meta>-veld met een pdf- of afbeeldingsbestand (noten, Sopraan, Alt, A, J, ...)
  const notenKnoppen = song.bestanden
    .map(([naam, w]) => {
      const noten = naam.toLowerCase() === 'noten';
      return `<a class="noten" href="#bekijk/${encodeURIComponent(bestand)}/${encodeURIComponent(w)}/${encodeURIComponent(noten ? 'Notenbeeld' : naam)}">${noten ? '♪ Notenbeeld' : esc(naam)}</a>`;
    })
    .join('');

  app.innerHTML = `${terugLink()}
    <h1>${esc(titel)}</h1>
    <p class="info">${esc(song.meta.artiest || artiestUitKop(song.kop))}</p>
    <p class="info" id="keyinfo"></p>
    ${song.capo ? `<p class="info">${esc(song.capo)}</p>` : ''}
    <div class="bedien" id="bedien"></div>
    ${notenKnoppen ? `<div class="notenrij">${notenKnoppen}</div>` : ''}
    ${vid ? `<iframe class="video" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}" title="Video bij ${esc(titel)}" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>` : ''}
    <div class="tekst" id="tekst"></div>`;
  if (song.meta.lettertype) document.getElementById('tekst').style.fontFamily = `"${song.meta.lettertype}", system-ui, sans-serif`;

  function teken() {
    const doel = origIdx < 0 ? 0 : (origIdx + stap + 120) % 12;
    const vorm = origIdx < 0 ? 0 : (origIdx + stap - capo + 120) % 12;
    const tabel = spelling(vorm, mineur);
    const tr = c => transponeer(c, stap + capoStart - capo, tabel);
    if (origIdx >= 0) {
      const naam = spelling(doel, mineur)[doel] + (mineur ? 'm' : '');
      const vormNaam = tabel[vorm] + (mineur ? 'm' : '');
      document.getElementById('keyinfo').textContent = 'Klinkende key: ' + naam + (stap ? ` (origineel ${song.key})` : '') + (capo ? ` · Capo ${capo}: je speelt de vormen van ${vormNaam}` : '');
      document.getElementById('bedien').innerHTML =
        '<button data-s="-1" aria-label="Halve toon lager">−</button><button data-s="1" aria-label="Halve toon hoger">+</button><span class="sp"></span>' +
        KNOPPEN.map(k => `<button data-k="${idx(k)}" class="${idx(k) === doel ? 'aan' : ''}">${k}${mineur ? 'm' : ''}</button>`).join('') +
        '<span style="flex-basis:100%;height:0"></span><span class="info">Capo:</span>' +
        Array.from({length: Math.max(8, capoStart + 1, ...afspraken.map(a => a.capo + 1))}, (_, c) => c).map(c => `<button data-c="${c}" class="${c === capo ? 'aan' : ''}">${c || 'geen'}</button>`).join('') +
        (afspraken.length ? '<span style="flex-basis:100%;height:0"></span><span class="info">Afspraak:</span>' +
          afspraken.map((a, i) => `<button data-a="${i}" class="${doel === a.idx && capo === a.capo ? 'aan' : ''}">${esc(a.tekst)}</button>`).join('') +
          '<button data-a="reset">↺ Zoals video</button>' : '');
    }
    document.getElementById('tekst').innerHTML = song.regels.map(r => {
      if (r.t === 'leeg') return '<div class="leeg"></div>';
      if (r.t === 'sec') return `<div class="sec">${esc(r.tekst)}</div>`;
      if (r.t === 'akk') return `<div class="akk">${r.akkoorden.map(c => `<span class="ch">${esc(tr(c))}</span>`).join('')}</div>`;
      const metAkk = r.segs.some(s => s.ch);
      if (!metAkk) return `<div class="regel">${esc(r.segs.map(s => s.ly).join(''))}</div>`;
      return `<div class="regel">${r.segs.map(s => `<span class="seg"><span class="ch">${esc(tr(s.ch))}</span><span class="ly">${esc(s.ly) || '\u200b'}</span></span>`).join('')}</div>`;
    }).join('');
  }
  document.getElementById('bedien').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a !== undefined) {
      if (b.dataset.a === 'reset') { stap = startStap; capo = capoStart; }
      else { const a = afspraken[Number(b.dataset.a)]; stap = (a.idx - origIdx + 12) % 12; capo = a.capo; }
    }
    else if (b.dataset.c !== undefined) capo = Number(b.dataset.c);
    else if (b.dataset.s) stap = (stap + Number(b.dataset.s) + 12) % 12;
    else stap = (Number(b.dataset.k) - origIdx + 12) % 12;
    toestand[bestand] = {stap, capo};
    teken();
  });
  teken();
}

function route() {
  if (huidigGeluid) { huidigGeluid.pause(); huidigGeluid = null; }
  if (location.hash === '#repertoire') toonOverzicht(true);
  else if (location.hash.startsWith('#bekijk/')) {
    const d = location.hash.slice(1).split('/').map(decodeURIComponent);
    toonBestand(d[1], d[2], d[3] || 'Notenbeeld');
  } else {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    h ? toonSong(h) : toonOverzicht(false);
  }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
